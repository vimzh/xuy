name: Linux package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev xvfb xauth xdotool

      - name: Install Rust and Dioxus CLI
        run: |
          rustup update stable
          rustup default stable
          mkdir -p "$RUNNER_TEMP/dioxus"
          download="$RUNNER_TEMP/dioxus/dx.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz \
            --output "$download"
          printf '%s  %s\n' 4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7 "$download" | sha256sum --check
          tar -xzf "$download" -C "$RUNNER_TEMP/dioxus"
          echo "$RUNNER_TEMP/dioxus" >> "$GITHUB_PATH"

      - name: Test and package
        run: |
          cargo test --locked
          dx bundle --linux --release --locked --package-types deb --out-dir "$RUNNER_TEMP/package"

      - name: Install the package and check the app opens
        run: |
          packages=("$RUNNER_TEMP"/package/*.deb)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          test "$(dpkg-deb --field "$package" Architecture)" = amd64
          sudo apt-get install -y "$package"
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          xvfb-run -a dbus-run-session -- bash -eu -c '
            xuy > "$RUNNER_TEMP/xuy.log" 2>&1 &
            pid=$!
            trap '\''kill "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/xuy.log"'\'' EXIT
            timeout 30s xdotool search --sync --onlyvisible --pid "$pid" --name "^xuy$"
          '

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: xuy-linux-amd64
          path: ${{ runner.temp }}/package/*.deb
          if-no-files-found: error
