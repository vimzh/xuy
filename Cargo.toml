[package]
name = "dojo"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rfd = { version = "0.17.2", default-features = false }
tempfile = "3.27"
tokio = { version = "1", features = ["rt", "sync"] }
