[package]
name = "xuy"
version = "0.1.3"
edition = "2024"

[dependencies]
base64 = "0.22"
dioxus = { version = "0.7.10", features = ["desktop"] }
linkify = "0.11"
percent-encoding = "2.3"
notify = "8.2.0"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "html", "regex-fancy"] }
tempfile = "3.27"
time = { version = "0.3", features = ["local-offset"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSUserDefaults", "std"] }
