[package]
name = "dojo"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rfd = { version = "0.17.2", default-features = false }
tempfile = "3.27"
time = { version = "0.3", features = ["local-offset"] }
tokio = { version = "1", features = ["rt", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSUserDefaults", "std"] }
